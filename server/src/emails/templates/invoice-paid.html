<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: system-ui, sans-serif; max-width: 600px; margin: 0 auto; padding: 24px;">
  <div style="text-align: center; margin-bottom: 32px;">
    <div style="width: 48px; height: 48px; background: #16A34A; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: white; font-size: 24px;">✓</div>
  </div>
  <h1 style="font-size: 24px; color: #1E3A5F; text-align: center; margin: 0 0 8px;">Payment Received</h1>
  <p style="color: #4B5563; font-size: 16px; text-align: center;">Invoice {{INVOICE_NUMBER}} has been paid</p>
  <div style="background: #F9FAFB; border-radius: 12px; padding: 24px; margin: 24px 0;">
    <p style="margin: 0 0 8px; font-size: 14px; color: #6B7280;">Amount Paid</p>
    <p style="font-size: 32px; font-weight: bold; color: #16A34A; margin: 0;">{{AMOUNT}}</p>
    <p style="margin: 8px 0 0; font-size: 14px; color: #6B7280;">Paid on {{PAID_DATE}}</p>
  </div>
  <hr style="border: none; border-top: 1px solid #E5E7EB; margin: 32px 0;" />
  <p style="color: #9CA3AF; font-size: 12px;">{{ORG_NAME}}</p>
</body>
</html>
