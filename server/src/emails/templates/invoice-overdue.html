<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: system-ui, sans-serif; max-width: 600px; margin: 0 auto; padding: 24px;">
  <div style="text-align: center; margin-bottom: 32px;">
    <div style="width: 48px; height: 48px; background: #DC2626; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: white; font-size: 24px;">!</div>
  </div>
  <h1 style="font-size: 24px; color: #1E3A5F; text-align: center; margin: 0 0 8px;">Friendly Reminder</h1>
  <p style="color: #4B5563; font-size: 16px; text-align: center;">Invoice {{INVOICE_NUMBER}} is now overdue</p>
  <div style="background: #FEF2F2; border-radius: 12px; padding: 24px; margin: 24px 0; border: 1px solid #FECACA;">
    <p style="margin: 0 0 8px; font-size: 14px; color: #6B7280;">Amount Due</p>
    <p style="font-size: 32px; font-weight: bold; color: #DC2626; margin: 0;">{{AMOUNT}}</p>
    <p style="margin: 8px 0 0; font-size: 14px; color: #6B7280;">Overdue since {{DUE_DATE}}</p>
  </div>
  <a href="{{INVOICE_URL}}" style="display: inline-block; background: #2563EB; color: white; text-decoration: none; padding: 12px 32px; border-radius: 8px; font-size: 16px; font-weight: 500;">Pay Now</a>
  <hr style="border: none; border-top: 1px solid #E5E7EB; margin: 32px 0;" />
  <p style="color: #9CA3AF; font-size: 12px;">{{ORG_NAME}}</p>
</body>
</html>
