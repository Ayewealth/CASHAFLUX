<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: system-ui, sans-serif; max-width: 600px; margin: 0 auto; padding: 24px;">
  <div style="text-align: center; margin-bottom: 32px;">
    <h1 style="font-size: 24px; color: #1E3A5F; margin: 0;">Invoice {{INVOICE_NUMBER}}</h1>
  </div>
  <p style="color: #4B5563; font-size: 16px;">Hi {{CLIENT_NAME}},</p>
  <p style="color: #4B5563; font-size: 16px;">You have a new invoice from <strong>{{ORG_NAME}}</strong>.</p>
  <div style="background: #F9FAFB; border-radius: 12px; padding: 24px; margin: 24px 0;">
    <p style="margin: 0 0 8px; font-size: 14px; color: #6B7280;">Amount Due</p>
    <p style="font-size: 32px; font-weight: bold; color: #1E3A5F; margin: 0;">{{AMOUNT}}</p>
    <p style="margin: 8px 0 0; font-size: 14px; color: #6B7280;">Due by {{DUE_DATE}}</p>
  </div>
  <a href="{{INVOICE_URL}}" style="display: inline-block; background: #2563EB; color: white; text-decoration: none; padding: 12px 32px; border-radius: 8px; font-size: 16px; font-weight: 500;">View Invoice</a>
  <p style="color: #4B5563; font-size: 16px; margin-top: 24px;">Thank you for your business!</p>
  <hr style="border: none; border-top: 1px solid #E5E7EB; margin: 32px 0;" />
  <p style="color: #9CA3AF; font-size: 12px;">{{ORG_NAME}} — {{ORG_ADDRESS}}</p>
</body>
</html>
